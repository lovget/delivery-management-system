name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build and test backend
        run: ./mvnw clean verify

      - name: Build backend Docker image
        run: docker build -t dms-backend:test .

      - name: Build frontend Docker image
        run: docker build -t dms-frontend:test ./frontend

      - name: Start stack and run healthcheck
        run: |
          cp .env.example .env
          docker compose up -d --build postgres backend
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthcheck passed"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck failed"
          docker compose logs backend postgres
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down -v
