name: CI/CD

'on':
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build frontend Docker image
        run: docker build -t dms-frontend:test ./frontend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend jar
        run: ./mvnw -B -DskipTests clean package

      - name: Build backend Docker image
          run: docker build -t dms-backend:test .

        tests:
          runs-on: ubuntu-latest
          needs: build
          steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: "21"
                cache: maven

            - name: Run backend tests
              run: ./mvnw -B test

        deploy:
          runs-on: ubuntu-latest
          needs: tests
          if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
          env:
            RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
            RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          steps:
            - name: Deploy backend on Render
              if: ${{ env.RENDER_BACKEND_DEPLOY_HOOK != '' }}
              run: curl -fsS -X POST "${{ env.RENDER_BACKEND_DEPLOY_HOOK }}"

            - name: Deploy frontend on Render
              if: ${{ env.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
              run: curl -fsS -X POST "${{ env.RENDER_FRONTEND_DEPLOY_HOOK }}"

            - name: Skip deploy if hooks are missing
              if: ${{ env.RENDER_BACKEND_DEPLOY_HOOK == '' || env.RENDER_FRONTEND_DEPLOY_HOOK == '' }}
              run: echo "Render deploy hooks are not configured. Skipping deployment step."

        healthcheck:
          runs-on: ubuntu-latest
          needs: deploy
          if: always() && needs.deploy.result == 'success'
          env:
            BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          steps:
            - name: Wait for app warm-up
              run: sleep 45

            - name: Healthcheck deployed backend
              if: ${{ env.BACKEND_HEALTHCHECK_URL != '' }}
              run: |
                for i in {1..12}; do
                  if curl -fsS "${{ env.BACKEND_HEALTHCHECK_URL }}" | grep -q '"status":"UP"'; then
                    echo "Deployed app is healthy"
                    exit 0
                  fi
                  sleep 10
                done
                echo "Healthcheck failed"
                exit 1

            - name: Skip healthcheck if URL is missing
              if: ${{ env.BACKEND_HEALTHCHECK_URL == '' }}
              run: echo "BACKEND_HEALTHCHECK_URL secret is not configured. Skipping healthcheck."